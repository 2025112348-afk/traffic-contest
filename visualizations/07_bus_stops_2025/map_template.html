<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2025년 3월 GTFS 버스 정류장 지도</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#172b4d;font:15px 'Malgun Gothic',sans-serif}header{padding:20px 24px 12px}h1{font-size:24px;margin:0 0 8px}p{margin:7px 0;color:#475569}nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 24px}input{min-width:240px;flex:1}input,button{padding:10px;border:1px solid #cbd5e1;border-radius:7px;background:white;font:inherit}button{cursor:pointer}#status{padding:0 24px 12px}#wrap{position:relative;height:68vh;min-height:420px;margin:0 24px;border:1px solid #cbd5e1;border-radius:10px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}#tip{position:absolute;display:none;background:#fff;padding:10px;border:1px solid #94a3b8;border-radius:6px;pointer-events:none;white-space:pre-line;max-width:320px;font-size:13px;box-shadow:0 2px 9px #0002}footer{padding:12px 24px;font-size:12px;color:#475569}#live{font-size:12px;padding:6px 24px}
</style>
<header><h1>버스 정류장은 어디에 있을까?</h1><p>2025년 3월 GTFS · 시내·농어촌·마을·시외·공항버스 · 휠로 확대, 드래그로 이동, 점 위에서 이름 확인</p></header>
<nav><input id="search" aria-label="버스 정류장 이름 또는 ID 검색" placeholder="버스 정류장 이름 또는 ID 검색"><button id="find">검색</button><button id="clear">검색 해제</button><button id="plus" aria-label="확대">＋</button><button id="minus" aria-label="축소">－</button><button id="reset">전체 보기</button></nav>
<div id="status" role="status"></div><div id="wrap"><canvas id="map" aria-label="버스 정류장 좌표 지도"></canvas><div id="tip"></div></div><div id="live"></div>
<footer>자료: 202503_GTFS_DataSet/stops.txt · 같은 좌표의 별도 ID 유지 · 점의 수는 운행 횟수나 이용객 수가 아닙니다.<br>배경: Natural Earth 저해상도 지형. 작은 섬이 생략될 수 있습니다. 거리·면적 측정용 지도가 아닙니다. 인터넷 없이 사용할 수 있습니다.</footer>
<script>
'use strict';
const stops=__STOPS__, land=__LAND__, C=Math.cos(36*Math.PI/180);
const points=stops.map(r=>[(r[2]-128)*C,-(r[3]-36)]);
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),wrap=document.getElementById('wrap'),tip=document.getElementById('tip');
let W=0,H=0,scale=1,ox=0,oy=0,selected=stops.map((_,i)=>i),drag=null,pending=false;
function fit(){scale=Math.min(W/(8.3*C),H/6.1)*.94;ox=W/2;oy=H/2;requestDraw()}
function resize(){const d=devicePixelRatio||1;W=wrap.clientWidth;H=wrap.clientHeight;canvas.width=W*d;canvas.height=H*d;ctx.setTransform(d,0,0,d,0,0);fit()}
function requestDraw(){if(!pending){pending=true;requestAnimationFrame(draw)}}
function draw(){pending=false;ctx.fillStyle='#eaf3f8';ctx.fillRect(0,0,W,H);ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
ctx.fillStyle='#f5f3ed';ctx.strokeStyle='#b8c4c9';ctx.lineWidth=.8;
for(const poly of land){ctx.beginPath();poly.forEach((p,i)=>{let x=(p[0]-128)*C*scale+ox,y=-(p[1]-36)*scale+oy;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fill();ctx.stroke()}
ctx.strokeStyle='#8499aa33';ctx.fillStyle='#526779';ctx.font='11px sans-serif';
for(let lon=123;lon<=133;lon++){let x=(lon-128)*C*scale+ox;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.fillText(lon+'°E',x+3,H-8)}
for(let lat=32;lat<=40;lat++){let y=-(lat-36)*scale+oy;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();ctx.fillText(lat+'°N',4,y-4)}
ctx.fillStyle=selected.length<3000?'#155daac0':'#155daa70';let count=0;const size=scale>1500?4:2;
for(const i of selected){const p=points[i],x=p[0]*scale+ox,y=p[1]*scale+oy;if(x<0||x>W||y<0||y>H)continue;ctx.fillRect(x-size/2,y-size/2,size,size);count++}ctx.restore();
document.getElementById('status').textContent=`전체 ${stops.length.toLocaleString()}개 ID · 검색 결과 ${selected.length.toLocaleString()}개 · 화면 내 ${count.toLocaleString()}개`}
function zoom(f,x=W/2,y=H/2){const ns=Math.max(30,Math.min(100000,scale*f));ox=x-(x-ox)*ns/scale;oy=y-(y-oy)*ns/scale;scale=ns;tip.style.display='none';requestDraw()}
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoom(e.deltaY<0?1.3:1/1.3,e.clientX-r.left,e.clientY-r.top)},{passive:false});
canvas.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,ox,oy];canvas.setPointerCapture(e.pointerId);tip.style.display='none'});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
canvas.addEventListener('pointerleave',()=>tip.style.display='none');
canvas.addEventListener('pointermove',e=>{if(drag){ox=drag[2]+e.clientX-drag[0];oy=drag[3]+e.clientY-drag[1];requestDraw();return}
const b=canvas.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top;let best=-1,dist=64;
for(const i of selected){let dx=points[i][0]*scale+ox-x,dy=points[i][1]*scale+oy-y,d=dx*dx+dy*dy;if(d<dist){dist=d;best=i}}
if(best<0){tip.style.display='none';return}const r=stops[best];tip.textContent=`${r[1]}\nID: ${r[0]}\n위도 ${r[3]} · 경도 ${r[2]}`;tip.style.display='block';tip.style.left=Math.max(0,Math.min(x+12,W-330))+'px';tip.style.top=Math.max(0,Math.min(y+12,H-90))+'px'});
function search(){const q=document.getElementById('search').value.trim().toLocaleLowerCase();selected=[];stops.forEach((r,i)=>{if(!q||r[0].toLocaleLowerCase().includes(q)||r[1].toLocaleLowerCase().includes(q))selected.push(i)});tip.style.display='none';
if(q&&selected.length){let xmin=Infinity,xmax=-Infinity,ymin=Infinity,ymax=-Infinity;for(const i of selected){const [x,y]=points[i];xmin=Math.min(xmin,x);xmax=Math.max(xmax,x);ymin=Math.min(ymin,y);ymax=Math.max(ymax,y)}scale=Math.min(W/Math.max(.01,xmax-xmin),H/Math.max(.01,ymax-ymin))*.8;scale=Math.min(scale,30000);ox=W/2-(xmin+xmax)/2*scale;oy=H/2-(ymin+ymax)/2*scale}requestDraw()}
document.getElementById('find').onclick=search;document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')search()};document.getElementById('clear').onclick=()=>{document.getElementById('search').value='';search();fit()};document.getElementById('reset').onclick=fit;document.getElementById('plus').onclick=()=>zoom(1.5);document.getElementById('minus').onclick=()=>zoom(1/1.5);
new ResizeObserver(resize).observe(wrap);
</script></html>
